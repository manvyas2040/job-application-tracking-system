<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - JATS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>🎯 JATS</h1>
            <div class="navbar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="jobs.html">Jobs</a>
                <a href="applications.html">Applications</a>
                <a href="profile.html">Profile</a>
                <a href="notifications.html">
                    Notifications <span id="notification-badge" class="badge" style="display:none; background:red; color:white; font-size:0.7rem; padding:2px 6px; border-radius:10px;">0</span>
                </a>
                <a href="change-password.html">🔐 Change Password</a>
                <div class="navbar-user">
                    <span id="user-email" class="user-badge"></span>
                    <span id="user-role" class="user-badge"></span>
                    <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>

        <div class="dashboard">
            <h2>My Profile</h2>
            
            <div id="profile-status" class="stat-card" style="margin-bottom: 30px; display:none;">
                <h3>⚠️ Profile Incomplete</h3>
                <p>Complete your profile to apply for jobs</p>
            </div>

            <div id="profile-container">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        requireAuth();

        const user = getUser();
        if (user.role !== 'candidate') {
            alert('Profile page is only for candidates');
            window.location.href = 'dashboard.html';
        }

        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-role').textContent = user.role;

        async function loadProfile() {
            const container = document.getElementById('profile-container');

            try {
                // Try to get profile
                const response = await fetch(`${API_URL}/candidate/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 404) {
                    // Profile doesn't exist
                    document.getElementById('profile-status').style.display = 'block';
                    container.innerHTML = `
                        <div style="text-align:center; padding:40px;">
                            <p style="color: var(--secondary); margin-bottom:20px;">You haven't created your profile yet</p>
                            <button class="btn btn-primary" onclick="window.location.href='create-profile.html'">
                                Create Profile Now
                            </button>
                        </div>
                    `;
                    return;
                }

                if (!response.ok) throw new Error('Failed to load profile');

                const profile = await response.json();

                container.innerHTML = `
                    <div style="background: white; padding: 30px; border-radius: 12px; border: 2px solid var(--border);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <h3>Profile Details</h3>
                            <button class="btn btn-primary btn-sm" onclick="openEditMode()">Edit Profile</button>
                        </div>

                        <div id="view-mode">
                            <div style="margin-bottom: 20px;">
                                <strong>Phone:</strong> ${escapeHtml(profile.phone)}
                            </div>
                            <div style="margin-bottom: 20px;">
                                <strong>Skills:</strong> 
                                <div style="margin-top:10px;">
                                    ${profile.skills.split(',').map(skill => 
                                        `<span class="badge badge-draft" style="margin: 5px;">${escapeHtml(skill.trim())}</span>`
                                    ).join('')}
                                </div>
                            </div>
                            <div style="margin-bottom: 20px;">
                                <strong>Experience:</strong> ${parseInt(profile.experience_years)} years
                            </div>
                            <div style="margin-bottom: 20px;">
                                <strong>Resume:</strong> ${escapeHtml(profile.resume_path || 'Not provided')}
                            </div>
                        </div>

                        <div id="edit-mode" style="display:none;">
                            <form onsubmit="updateProfile(event)">
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="edit-phone" value="${escapeHtml(profile.phone)}" required>
                                </div>
                                <div class="form-group">
                                    <label>Skills</label>
                                    <textarea id="edit-skills" rows="3" required>${escapeHtml(profile.skills)}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Years of Experience</label>
                                    <input type="number" id="edit-experience" value="${parseInt(profile.experience_years)}" required min="0" max="50">
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <button type="submit" class="btn btn-success">Save Changes</button>
                                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
                                </div>
                            </form>
                        </div>

                        <!-- Resume Upload Section -->
                        <hr style="margin: 30px 0; border: none; border-top: 2px solid var(--border);">
                        <div style="margin-top: 30px;">
                            <h3>📄 Resume Management</h3>
                            <div class="resume-upload-container" id="resume-section">
                                <!-- Content loaded by JavaScript -->
                            </div>
                        </div>
                    </div>
                `;

                // Mark profile as complete
                const updatedUser = { ...user, profile_complete: true };
                setUser(updatedUser);
                
                // Load resume section
                loadResumeSection(profile.resume_path);

            } catch (error) {
                container.innerHTML = `<p style="color:red; text-align:center; padding:40px;">Error: ${error.message}</p>`;
            }
        }

        function loadResumeSection(currentResume) {
            const section = document.getElementById('resume-section');
            
            if (currentResume) {
                section.innerHTML = `
                    <div class="resume-card">
                        <div class="resume-info">
                            <div class="resume-icon">📄</div>
                            <div>
                                <p class="resume-name">${escapeHtml(currentResume)}</p>
                                <p class="resume-meta">Current Resume (PDF)</p>
                            </div>
                        </div>
                        <div class="resume-actions">
                            <button class="btn-icon" onclick="downloadResume('${currentResume}')" title="Download">
                                ⬇️
                            </button>
                            <button class="btn-icon btn-danger-icon" onclick="deleteAndReuploadResume()" title="Replace">
                                🔄
                            </button>
                        </div>
                    </div>
                `;
            } else {
                section.innerHTML = `
                    <div class="empty-state">
                        <p>No resume uploaded yet</p>
                    </div>
                `;
            }
            
            // Add upload form
            section.innerHTML += `
                <div class="upload-zone" id="dropZone">
                    <input type="file" id="resumeInput" accept=".pdf" style="display:none;">
                    <div class="upload-content">
                        <div class="upload-icon">📁</div>
                        <p class="upload-text">Drag your PDF resume here or click to upload</p>
                        <p class="upload-hint">Maximum file size: 10MB</p>
                    </div>
                    <div id="upload-progress" class="upload-progress" style="display:none;">
                        <div class="progress-bar"></div>
                        <p>Uploading...</p>
                    </div>
                    <div id="upload-status" class="upload-status"></div>
                </div>
            `;
            
            setupResumeUploadHandlers();
            
            }
        function openEditMode() {
            document.getElementById('view-mode').style.display = 'none';
            document.getElementById('edit-mode').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('view-mode').style.display = 'block';
            document.getElementById('edit-mode').style.display = 'none';
            hideError('edit-error');
        }

        async function updateProfile(event) {
            event.preventDefault();

            const phone = document.getElementById('edit-phone').value;
            const skills = document.getElementById('edit-skills').value;
            const experience = parseInt(document.getElementById('edit-experience').value);

            hideError('edit-error');

            try {
                await apiCall('/candidate/profile', {
                    method: 'PATCH',
                    body: JSON.stringify({
                        phone,
                        skills,
                        experience_years: experience
                    })
                });

                alert('Profile updated successfully!');
                loadProfile();
            } catch (error) {
                showError('edit-error', error.message);
            }
        }

        function setupResumeUploadHandlers() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('resumeInput');

            if (!dropZone || !fileInput) return;

            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadResume(files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadResume(e.target.files[0]);
                }
            });
        }

        async function uploadResume(file) {
            const dropZone = document.getElementById('dropZone');
            const statusDiv = document.getElementById('upload-status');
            const progressDiv = document.getElementById('upload-progress');

            if (!file.type === 'application/pdf') {
                statusDiv.innerHTML = `<div class="error-message">❌ Only PDF files are allowed</div>`;
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                statusDiv.innerHTML = `<div class="error-message">❌ File too large (max 10MB)</div>`;
                return;
            }

            progressDiv.style.display = 'block';
            statusDiv.innerHTML = '';

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(`${API_URL}/files/upload/resume`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Upload failed');
                }

                const data = await response.json();
                progressDiv.style.display = 'none';
                statusDiv.innerHTML = `<div class="success-message">✅ Resume uploaded successfully!</div>`;
                
                setTimeout(() => {
                    loadProfile();
                }, 1500);

            } catch (error) {
                progressDiv.style.display = 'none';
                statusDiv.innerHTML = `<div class="error-message">❌ ${escapeHtml(error.message)}</div>`;
            }
        }

        async function downloadResume(filename) {
            try {
                const response = await fetch(`${API_URL}/files/resume/${filename}`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to download resume');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('Error downloading resume: ' + error.message);
            }
        }

        async function deleteAndReuploadResume() {
            if (!confirm('Are you sure you want to replace your current resume?')) {
                return;
            }
            document.getElementById('resumeInput').click();
        }

        loadProfile();
    </script>
</body>
</html>
